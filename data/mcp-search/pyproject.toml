[project]
name = "mcp-search"
version = "0.1.0"
description = "Full-text search MCP for mmiri28 solutions — Postgres tsvector."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.0",
]

[project.scripts]
mcp-search = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
