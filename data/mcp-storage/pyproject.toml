[project]
name = "mcp-storage"
version = "0.1.0"
description = "Storage MCP for mmiri28 solutions — Cloudflare R2, private + public buckets."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
mcp-storage = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "moto[s3]>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
