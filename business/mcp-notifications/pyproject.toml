[project]
name = "mcp-notifications"
version = "0.1.0"
description = "Notifications MCP for mmiri28 solutions — Resend email, Twilio/Termii SMS."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
mcp-notifications = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = ["pytest>=8.0.0", "respx>=0.21.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
