[project]
name = "mcp-webhooks"
version = "0.1.0"
description = "Webhooks MCP for mmiri28 solutions — register, deliver, verify, retry."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.0",
]

[project.scripts]
mcp-webhooks = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = ["pytest>=8.0.0", "respx>=0.21.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
