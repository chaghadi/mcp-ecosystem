[project]
name = "mcp-billing"
version = "0.1.0"
description = "Billing MCP for mmiri28 solutions — Stripe (international) + Paystack (Nigeria)."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "stripe>=7.0.0",
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.0",
]

[project.scripts]
mcp-billing = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "respx>=0.21.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
