[project]
name = "mcp-auth"
version = "0.1.0"
description = "Auth MCP for mmiri28 solutions — email/phone/username login, JWT, app-scoped roles."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "psycopg2-binary>=2.9.0",
    "redis>=5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.0",
]

[project.scripts]
mcp-auth = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "fakeredis>=2.20.0",
    "freezegun>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
