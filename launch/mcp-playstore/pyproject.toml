[project]
name = "mcp-playstore"
version = "0.1.0"
description = "Google Play Console — Android listings, reviews, release tracks."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "google-auth>=2.27.0",
    "google-auth-httplib2>=0.2.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
mcp-playstore = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
