[project]
name = "mcp-ssl"
version = "0.1.0"
description = "SSL certificate inspection — expiry, chain, fingerprint."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
mcp-ssl = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
